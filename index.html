      }

      .preloader {
        opacity: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% calc(-50% + var(--space-xxl));
        width: 50%;
        max-width: 10rem;
        transition:
          opacity 0.3s cubic-bezier(0.47, 0, 0.745, 0.715),
          translate 0.3s cubic-bezier(0.47, 0, 0.745, 0.715);
        pointer-events: none;
      }

      .preloader.is-ready {
        opacity: 1;
        translate: -50% 0;
      }

      .preloader__track {
        overflow: hidden;
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        height: var(--border-width-m);
        width: 100%;
      }

      .preloader__track::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: var(--color-border);
      }

      .preloader__fill {
        position: absolute;
        translate: -50% 0;
        height: 100%;
        width: 50%;
        background: var(--color-accent-primary);
        animation: loading 1.5s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      }

      @keyframes loading {
        0% {
          translate: -50% 0;
        }
        50% {
          translate: 150% 0;
        }
        100% {
          translate: -50% 0;
        }
      }

      @media screen and (min-width: 30.0625em) {

            max(env(safe-area-inset-left), var(--space-xxl));

      @media screen and (prefers-color-scheme: dark) {
        body::before {
          opacity: 0.25;
        }
